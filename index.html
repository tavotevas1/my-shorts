<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowShorts AI Studio - Fully Working</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 26px; font-weight: 800; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1100px; width: 100%; justify-content: center; }
        .controls, .preview { flex: 1; min-width: 340px; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; }
        .preview { display: flex; flex-direction: column; align-items: center; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; font-size: 13px; text-transform: uppercase; }
        textarea, input, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 14px; }
        textarea { height: 110px; resize: vertical; }
        button { margin-top: 20px; padding: 15px; background: #2563eb; color: white; border: none; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        button:hover { background: #1d4ed8; }
        canvas { border-radius: 12px; border: 3px solid #38bdf8; max-width: 300px; height: auto; background: #000; box-shadow: 0 0 25px rgba(56,189,248,0.25); }
        #downloadBtn { background: #16a34a; display: none; margin-top: 15px; text-decoration: none; width: 100%; text-align: center; }
        #downloadBtn button { margin-top: 0; background: #16a34a; }
        .status { margin-top: 12px; font-size: 14px; color: #f59e0b; text-align: center; font-weight: 700; }
    </style>
</head>
<body>

    <h1>🎬 FlowShorts AI Studio</h1>

    <div class="container">
        <div class="controls">
            <label for="bgFile">1. Pasirinkite Fono Vaizdo Įrašą arba Nuotrauką (Pasirinktinai):</label>
            <input type="file" id="bgFile" accept="video/*,image/*">

            <label for="script">2. Video Istorija / Scenarijus:</label>
            <textarea id="script">Harrison was trapped inside a dark sunken ship deep underwater for three whole days.</textarea>

            <button id="generateBtn" onclick="generateShort()">⚡ Generuoti Shorts Video</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="flowshorts_video.webm"><button>⬇️️ Atsisiųsti Video</button></a>
        </div>

        <div class="preview">
            <h3>9:16 Vertikalus Peržiūros Langas</h3>
            <canvas id="videoCanvas" width="1080" height="1920" style="margin-top:15px;"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let bgMedia = null;
        let isVideo = false;
        let animationFrameId;

        // Fono įkėlimo apdorojimas
        document.getElementById('bgFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                bgMedia = document.createElement('video');
                bgMedia.src = url;
                bgMedia.loop = true;
                bgMedia.muted = true;
                bgMedia.playsInline = true;
                bgMedia.play();
                isVideo = true;
            } else {
                bgMedia = new Image();
                bgMedia.src = url;
                isVideo = false;
            }
        });

        function generateShort() {
            const scriptText = document.getElementById('script').value.trim();
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!scriptText) return alert("Įveskite tekstą!");

            downloadBtn.style.display = 'none';
            status.innerText = "🎙️️ Ruošiamas įgarsinimas...";

            const synth = window.speechSynthesis;
            synth.cancel();
            const utterance = new SpeechSynthesisUtterance(scriptText);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;

            const stream = canvas.captureStream(30);
            let mediaRecorder;
            const chunks = [];

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch(e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                status.innerText = "✅ Video sėkmingai sugeneruotas!";
            };

            mediaRecorder.start();
            synth.speak(utterance);
            status.innerText = "🎥 Generuojamas vaizdas ir įrašoma...";

            let time = 0;

            function render() {
                time += 0.03;

                // 1. Piesiamas fonas
                if (bgMedia) {
                    if (isVideo && bgMedia.readyState >= 2) {
                        ctx.drawImage(bgMedia, 0, 0, canvas.width, canvas.height);
                    } else if (!isVideo) {
                        ctx.drawImage(bgMedia, 0, 0, canvas.width, canvas.height);
                    }
                } else {
                    // Generuojamas dinaminis animuotas fonas (jei niekas neįkelta)
                    let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    grad.addColorStop(0, '#0f172a');
                    grad.addColorStop(0.5, '#1e1b4b');
                    grad.addColorStop(1, '#311042');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Judančios šviesos dalelės
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
                    for (let i = 0; i < 20; i++) {
                        let x = (Math.sin(time + i) * 0.5 + 0.5) * canvas.width;
                        let y = ((time * 100 + i * 150) % canvas.height);
                        ctx.beginPath();
                        ctx.arc(x, y, 30 + (i % 20), 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Tamsinimo sluoksnis subtitrams
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. Subtitrų formavimas
                ctx.font = '900 60px Arial, sans-serif';
                ctx.textAlign = 'center';

                const words = scriptText.toUpperCase().split(' ');
                let line = '';
                let lines = [];

                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + ' ';
                    if (ctx.measureText(testLine).width > canvas.width - 200 && n > 0) {
                        lines.push(line);
                        line = words[n] + ' ';
                    } else {
                        line = testLine;
                    }
                }
                lines.push(line);

                // Subtitrų fono dėžutė
                const boxHeight = lines.length * 80 + 50;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(80, canvas.height / 2 - (boxHeight / 2), canvas.width - 160, boxHeight, 20);
                ctx.fill();

                // Subtitrų tekstas
                let startY = canvas.height / 2 - ((lines.length - 1) * 40);
                lines.forEach((l, idx) => {
                    ctx.lineWidth = 8;
                    ctx.strokeStyle = '#000000';
                    ctx.strokeText(l.trim(), canvas.width / 2, startY + (idx * 80));

                    ctx.fillStyle = '#facc15';
                    ctx.fillText(l.trim(), canvas.width / 2, startY + (idx * 80));
                });

                if (synth.speaking) {
                    animationFrameId = requestAnimationFrame(render);
                } else {
                    mediaRecorder.stop();
                    cancelAnimationFrame(animationFrameId);
                }
            }

            render();
        }
    </script>
</body>
</html>
