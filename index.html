<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro AI Shorts Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', 'Segoe UI', sans-serif; }
        body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 28px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1050px; width: 100%; justify-content: center; }
        .controls { flex: 1; min-width: 320px; background: #131c2e; padding: 25px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .preview { flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center; background: #131c2e; padding: 25px; border-radius: 16px; border: 1px solid #1e293b; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 600; color: #38bdf8; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
        textarea, select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0b1120; color: #fff; font-size: 14px; }
        textarea { height: 110px; resize: vertical; }
        button { width: 100%; margin-top: 20px; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        button:hover { background: #1d4ed8; }
        canvas { border-radius: 12px; border: 3px solid #38bdf8; max-width: 300px; max-height: 533px; width: 100%; height: auto; background: #000; box-shadow: 0 0 20px rgba(56,189,248,0.2); }
        #downloadBtn { background: #16a34a; display: none; margin-top: 15px; box-shadow: 0 4px 14px rgba(22,163,74,0.4); }
        #downloadBtn:hover { background: #15803d; }
        .status { margin-top: 12px; font-size: 14px; color: #f59e0b; text-align: center; font-weight: 600; }
    </style>
</head>
<body>

    <h1>🎬 Pro YouTube Shorts Creator</h1>

    <div class="container">
        <div class="controls">
            <label for="topic">Search Keyword for Images:</label>
            <input type="text" id="topic" value="ocean underwater ship" placeholder="e.g. ocean, space, history, dark forest">

            <label for="script">Story Script (English):</label>
            <textarea id="script">Did you know about the unbelievable true story of Harrison Okene? In 2013, a tugboat capsized in the Atlantic Ocean, sinking 100 feet deep. Harrison was trapped inside the dark sunken ship for three days. Miraculously, he survived in a tiny air pocket and was rescued alive!</textarea>

            <label for="voiceSelect">Select Voice:</label>
            <select id="voiceSelect"></select>

            <button id="generateBtn" onclick="startGeneration()">⚡ Generate Shorts Video</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="short_story.webm"><button>⬇️ Download HD Video</button></a>
        </div>

        <div class="preview">
            <h3>Vertical Preview (9:16)</h3>
            <canvas id="videoCanvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        let voices = [];
        const synth = window.speechSynthesis;
        const voiceSelect = document.getElementById('voiceSelect');
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let fetchedImages = [];
        let animationFrameId;

        function populateVoiceList() {
            voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
            voiceSelect.innerHTML = '';
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                option.setAttribute('data-index', index);
                voiceSelect.appendChild(option);
            });
        }

        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
        }

        // Fetch auto-changing background images from Unsplash
        async function fetchTopicImages(keyword) {
            const urls = [
                `https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1080&q=80`,
                `https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1080&q=80`,
                `https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1080&q=80`,
                `https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1080&q=80`
            ];
            
            const loadedImages = [];
            for (let url of urls) {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = url;
                await new Promise(r => img.onload = r);
                loadedImages.push(img);
            }
            return loadedImages;
        }

        async function startGeneration() {
            const scriptText = document.getElementById('script').value;
            const topic = document.getElementById('topic').value || 'nature';
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.style.display = 'none';

            if (!scriptText) return alert('Enter a script!');

            status.innerText = "🖼️ Loading background images...";
            fetchedImages = await fetchTopicImages(topic);

            status.innerText = "🎙️ Synthesizing Voice & Rendering Video...";

            // Break script into short chunks (word groups for dynamic subtitles)
            const sentences = scriptText.match(/[^.!?]+[.!?]+/g) || [scriptText];
            
            const selectedVoiceIndex = voiceSelect.selectedOptions[0]?.getAttribute('data-index');
            const utterance = new SpeechSynthesisUtterance(scriptText);
            if (voices[selectedVoiceIndex]) utterance.voice = voices[selectedVoiceIndex];
            
            utterance.rate = 1.0;

            const canvasStream = canvas.captureStream(30);
            const mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                status.innerText = "✅ Shorts Ready! Click Download below.";
            };

            mediaRecorder.start();
            synth.cancel();

            let startTime = Date.now();
            let currentSentenceIndex = 0;
            
            // Sentence timing tracking
            utterance.onboundary = (event) => {
                if (event.name === 'sentence' || event.name === 'word') {
                    const progress = event.charIndex / scriptText.length;
                    currentSentenceIndex = Math.floor(progress * sentences.length);
                }
            };

            utterance.onend = () => {
                setTimeout(() => {
                    mediaRecorder.stop();
                    cancelAnimationFrame(animationFrameId);
                }, 800);
            };

            synth.speak(utterance);

            // Render loop with image slideshow and highlighted text
            function render() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Switch image every 3.5 seconds
                const imgIndex = Math.floor(elapsed / 3.5) % fetchedImages.length;
                const currentImg = fetchedImages[imgIndex];

                // Draw Background Image
                ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);

                // Dark Overlay for Contrast
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Subtitle Box
                const currentText = sentences[Math.min(currentSentenceIndex, sentences.length - 1)] || scriptText;
                
                ctx.fillStyle = '#facc15'; // Yellow Accent Box
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 15;
                ctx.font = '900 68px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Text background box
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.roundRect(80, canvas.height / 2 - 180, canvas.width - 160, 360, 20);
                ctx.fill();

                // Draw Text
                ctx.fillStyle = '#ffffff';
                wrapAndHighlightText(ctx, currentText.trim(), canvas.width / 2, canvas.height / 2, canvas.width - 220, 85);

                if (synth.speaking) {
                    animationFrameId = requestAnimationFrame(render);
                }
            }

            render();
        }

        function wrapAndHighlightText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for (let k = 0; k < lines.length; k++) {
                // Draw yellow highlight for first word of each line
                context.fillStyle = '#facc15';
                context.fillText(lines[k], x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
