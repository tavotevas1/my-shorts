<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Viral Shorts Video Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: #080c14; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 28px; font-weight: 800; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1050px; width: 100%; justify-content: center; }
        .controls { flex: 1; min-width: 320px; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        .preview { flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; font-size: 13px; text-transform: uppercase; letter-spacing: 0.8px; }
        textarea, select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 14px; }
        textarea { height: 110px; resize: vertical; }
        button { width: 100%; margin-top: 20px; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        button:hover { background: #1d4ed8; }
        canvas { border-radius: 12px; border: 3px solid #38bdf8; max-width: 300px; max-height: 533px; width: 100%; height: auto; background: #000; box-shadow: 0 0 25px rgba(56,189,248,0.25); }
        #downloadBtn { background: #16a34a; display: none; margin-top: 15px; box-shadow: 0 4px 14px rgba(22,163,74,0.4); text-decoration: none; }
        #downloadBtn button { margin-top: 0; }
        .status { margin-top: 12px; font-size: 14px; color: #f59e0b; text-align: center; font-weight: 700; }
    </style>
</head>
<body>

    <h1>🎬 Realistic AI Short Video Generator</h1>

    <div class="container">
        <!-- Controls -->
        <div class="controls">
            <label for="topic">Video Clips Keyword (Pexels / Pixabay):</label>
            <input type="text" id="topic" value="ocean underwater storm dark" placeholder="e.g. ocean, space, dark forest, warfare">

            <label for="script">Story Script (English):</label>
            <textarea id="script">Did you know about the unbelievable true story of Harrison Okene? In 2013, a tugboat capsized in the Atlantic Ocean, sinking 100 feet deep into the pitch black water. Harrison was trapped inside the freezing sunken ship for 3 whole days. Miraculously, he survived in a tiny air pocket and was rescued alive by divers!</textarea>

            <label for="voicePitch">Voice Type:</label>
            <select id="voicePitch">
                <option value="male_deep">Deep Storyteller Voice (Male)</option>
                <option value="female_smooth">Dramatic Female Voice</option>
            </select>

            <button id="generateBtn" onclick="startGeneration()">⚡ Generate Viral Short Video</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="viral_story.webm"><button>⬇️ Download Video (HD .webm/.mp4)</button></a>
        </div>

        <!-- Preview -->
        <div class="preview">
            <h3>Vertical Preview (9:16)</h3>
            <canvas id="videoCanvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let videoClips = [];
        let animationFrameId;

        // Sample HD Vertical Short Background Video Clips
        const defaultVideoURLs = [
            "https://assets.mixkit.co/videos/preview/mixkit-underwater-view-of-sea-water-43306-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-dark-blue-water-in-a-pool-41484-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-stormy-sea-waves-under-a-dark-sky-41527-large.mp4"
        ];

        async function loadVideoClips() {
            const loadedElements = [];
            for (let url of defaultVideoURLs) {
                const video = document.createElement('video');
                video.src = url;
                video.crossOrigin = "anonymous";
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                await new Promise(res => {
                    video.onloadeddata = res;
                    video.onerror = res;
                });
                video.play();
                loadedElements.push(video);
            }
            return loadedElements;
        }

        async function startGeneration() {
            const scriptText = document.getElementById('script').value;
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.style.display = 'none';

            if (!scriptText) return alert('Enter a script!');

            status.innerText = "🎥 Loading HD Video Clips...";
            videoClips = await loadVideoClips();

            status.innerText = "🎙️ Synthesizing Realistic AI Speech...";

            // Setup Browser Speech Synthesis (using high-pitch dramatic voice profile)
            const synth = window.speechSynthesis;
            const utterance = new SpeechSynthesisUtterance(scriptText);
            
            const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
            const selectedPitch = document.getElementById('voicePitch').value;
            
            if (voices.length > 0) {
                // Pick Google or Natural English voices if available
                const naturalVoice = voices.find(v => v.name.includes("Google") || v.name.includes("Natural")) || voices[0];
                utterance.voice = naturalVoice;
            }

            if (selectedPitch === "male_deep") {
                utterance.pitch = 0.8;
                utterance.rate = 0.95;
            } else {
                utterance.pitch = 1.1;
                utterance.rate = 1.0;
            }

            // Split into short caption blocks
            const sentences = scriptText.match(/[^.!?]+[.!?]+/g) || [scriptText];

            const canvasStream = canvas.captureStream(30);
            const mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });
            const chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                status.innerText = "✅ Your Video is Ready! Download below.";
            };

            mediaRecorder.start();
            synth.cancel();

            let startTime = Date.now();
            let currentSentenceIndex = 0;

            utterance.onboundary = (event) => {
                if (event.name === 'word' || event.name === 'sentence') {
                    const progress = event.charIndex / scriptText.length;
                    currentSentenceIndex = Math.floor(progress * sentences.length);
                }
            };

            utterance.onend = () => {
                setTimeout(() => {
                    mediaRecorder.stop();
                    cancelAnimationFrame(animationFrameId);
                }, 800);
            };

            synth.speak(utterance);

            // Render loop with dynamic mini-videos switching every 4 seconds
            function render() {
                const elapsed = (Date.now() - startTime) / 1000;
                
                // Switch Video Clip every 4 seconds
                const clipIndex = Math.floor(elapsed / 4) % videoClips.length;
                const activeVideo = videoClips[clipIndex];

                // Render Background Video to Canvas (Crop & Fit 9:16)
                if (activeVideo && activeVideo.readyState >= 2) {
                    ctx.drawImage(activeVideo, 0, 0, canvas.width, canvas.height);
                }

                // Dark Vignette / Gradient Overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Subtitle Box Frame
                const currentText = (sentences[Math.min(currentSentenceIndex, sentences.length - 1)] || scriptText).trim();

                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(80, canvas.height / 2 - 180, canvas.width - 160, 360, 24);
                ctx.fill();

                // Draw Text
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 12;
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                wrapAndHighlightText(ctx, currentText, canvas.width / 2, canvas.height / 2, canvas.width - 220, 80);

                if (synth.speaking) {
                    animationFrameId = requestAnimationFrame(render);
                }
            }

            render();
        }

        function wrapAndHighlightText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let lines = [];

            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lines.push(line);
                    line = words[n] + ' ';
                } else {
                    line = testLine;
                }
            }
            lines.push(line);

            let startY = y - ((lines.length - 1) * lineHeight) / 2;
            for (let k = 0; k < lines.length; k++) {
                context.fillStyle = (k === 0) ? '#facc15' : '#ffffff'; // First line yellow highlight
                context.fillText(lines[k], x, startY + (k * lineHeight));
            }
        }
    </script>
</body>
</html>
