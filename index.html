    <script>
        // DOM Elements
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const apiKeyInput = document.getElementById('apiKey');
        const voiceSelect = document.getElementById('voiceSelect');
        const subtitleStyleSelect = document.getElementById('subtitleStyleSelect');
        const bgmSelect = document.getElementById('bgmSelect');
        const scriptInput = document.getElementById('scriptInput');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const downloadLink = document.getElementById('downloadLink');
        const liveStatusText = document.getElementById('liveStatusText');

        // Scene State
        let scenes = [
            { media: null, isVideo: false, prompt: "In 1974 during a birthday party in a small town, a creepy clown balloon floated by the window." },
            { media: null, isVideo: false, prompt: "Two young boys vanished into the dark cellar crawlspace following a mysterious ghost voice." }
        ];
        let activeSceneIndex = 0;
        let renderAnimationId = null;

        // Auto Keyword Emoji Map for Nightline Horror
        const EMOJI_MAP = {
            "CLOWN": "🤡", "BALLOON": "🎈", "BOYS": "👦", "CELLAR": "🏚️", "POLICE": "🕵️",
            "GHOST": "👻", "HOUSE": "🏠", "PARTY": "🎉", "DARK": "🌑", "VOICE": "🗣️",
            "CREEPY": "😱", "TOWN": "🏙️", "WINDOW": "🪟", "CAR": "🚗", "MONSTER": "👹"
        };

        function addScene() {
            const idx = scenes.length;
            scenes.push({ media: null, isVideo: false, prompt: "New scene prompt" });

            const scenesContainer = document.getElementById('scenesContainer');
            const sceneDiv = document.createElement('div');
            sceneDiv.className = 'scene-item bg-slate-950/90 border border-slate-800 p-3.5 rounded-xl space-y-2 relative';
            sceneDiv.setAttribute('data-scene', idx);
            sceneDiv.innerHTML = `
                <div class="flex items-center justify-between text-xs font-bold text-slate-400">
                    <span><i class="fa-solid fa-clapperboard text-flow-cyan mr-1"></i> Scene ${idx + 1}</span>
                    <button onclick="generateSceneImage(${idx})" class="text-[10px] bg-purple-500/20 text-purple-300 hover:bg-purple-500/30 border border-purple-500/30 px-2 py-0.5 rounded font-bold transition">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> AI Generate Visual
                    </button>
                </div>
                <input type="text" class="scene-prompt w-full bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-flow-cyan" value="Dark creepy atmosphere visual scene ${idx + 1}">
                <div class="flex items-center gap-2">
                    <input type="file" accept="image/*,video/*" onchange="handleSceneMediaUpload(event, ${idx})" class="w-full text-[10px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700">
                    <span class="scene-preview-status text-[10px] text-emerald-400 font-bold hidden"><i class="fa-solid fa-check"></i> Loaded</span>
                </div>
            `;
            scenesContainer.appendChild(sceneDiv);
        }

        function handleSceneMediaUpload(e, sceneIdx) {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            const statusEl = document.querySelectorAll('.scene-preview-status')[sceneIdx];

            if (file.type.startsWith('video/')) {
                const video = document.createElement('video');
                video.src = url;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.onloadedmetadata = () => video.play();
                scenes[sceneIdx].media = video;
                scenes[sceneIdx].isVideo = true;
            } else {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    scenes[sceneIdx].media = img;
                    scenes[sceneIdx].isVideo = false;
                };
            }

            if (statusEl) statusEl.classList.remove('hidden');
        }

        // Generates scene background image using Gemini 3.1 Flash Lite Image
        async function generateSceneImage(sceneIdx) {
            const promptInputs = document.querySelectorAll('.scene-prompt');
            const prompt = promptInputs[sceneIdx]?.value || scenes[sceneIdx].prompt;

            updateStatus(`🎨 Generating visual for Scene ${sceneIdx + 1}...`);
            try {
                const apiKey = ""; // Canvas runtime provides this
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite-image:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `High quality vertical 9:16 dark cinematic horror retro scene, 1970s atmosphere: ${prompt}` }] }],
                        generationConfig: { responseModalities: ['TEXT', 'IMAGE'] }
                    })
                });

                const result = await response.json();
                const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;

                if (!base64Data) throw new Error("Could not generate image.");

                const img = new Image();
                img.src = `data:image/png;base64,${base64Data}`;
                img.onload = () => {
                    scenes[sceneIdx].media = img;
                    scenes[sceneIdx].isVideo = false;
                    const statusEl = document.querySelectorAll('.scene-preview-status')[sceneIdx];
                    if (statusEl) statusEl.classList.remove('hidden');
                    updateStatus(`✅ Scene ${sceneIdx + 1} Visual Ready!`, "success");
                    drawCanvasFrame(0, null, 0);
                };
            } catch (err) {
                console.error(err);
                updateStatus(`Failed to generate visual for Scene ${sceneIdx + 1}`, "error");
            }
        }

        function updateStatus(message, type = 'info') {
            statusBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-slate-900', 'text-amber-400', 'border-slate-800');
            
            if (type === 'error') {
                statusBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                statusIcon.className = 'fa-solid fa-triangle-exclamation text-sm';
            } else if (type === 'success') {
                statusBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                statusIcon.className = 'fa-solid fa-circle-check text-sm';
            } else {
                statusBox.classList.add('bg-slate-900', 'text-amber-400', 'border', 'border-slate-800');
                statusIcon.className = 'fa-solid fa-circle-notch animate-spin text-sm';
            }

            statusText.innerText = message;
        }

        // Fetch ElevenLabs with Word Timestamps
        async function fetchElevenLabsWithTimestamps(text, apiKey, voiceId) {
            const cleanKey = apiKey.trim();
            const cleanVoice = voiceId.trim();

            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${cleanVoice}/with-timestamps`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'xi-api-key': cleanKey
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                })
            });

            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                throw new Error(errJson?.detail?.message || `ElevenLabs Error: ${response.status}`);
            }

            const data = await response.json();
            const audioBytes = atob(data.audio_base64);
            const arrayBuffer = new ArrayBuffer(audioBytes.length);
            const uint8Array = new Uint8Array(arrayBuffer);
            for (let i = 0; i < audioBytes.length; i++) {
                uint8Array[i] = audioBytes.charCodeAt(i);
            }
            const audioBlob = new Blob([uint8Array], { type: 'audio/mpeg' });
            const audioUrl = URL.createObjectURL(audioBlob);

            const wordTimings = processAlignmentToWordTimings(data.alignment);
            return { audioUrl, wordTimings };
        }

        function processAlignmentToWordTimings(alignment) {
            if (!alignment || !alignment.characters) return [];

            const chars = alignment.characters;
            const starts = alignment.character_start_times_seconds;
            const ends = alignment.character_end_times_seconds;

            const wordList = [];
            let currentWord = "";
            let wordStart = null;
            let wordEnd = null;

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                if (wordStart === null && char.trim() !== "") wordStart = starts[i];

                if (char === " " || char === "\n" || i === chars.length - 1) {
                    if (i === chars.length - 1 && char.trim() !== "") {
                        currentWord += char;
                        wordEnd = ends[i];
                    } else if (i > 0) {
                        wordEnd = ends[i - 1];
                    }

                    if (currentWord.trim().length > 0) {
                        let cleanW = currentWord.trim().toUpperCase();
                        let emoji = EMOJI_MAP[cleanW.replace(/[^A-Z]/g, '')] || "";
                        wordList.push({
                            word: cleanW + (emoji ? ` ${emoji}` : ""),
                            rawWord: cleanW,
                            start: wordStart !== null ? wordStart : 0,
                            end: wordEnd !== null ? wordEnd : wordStart + 0.3
                        });
                    }

                    currentWord = "";
                    wordStart = null;
                    wordEnd = null;
                } else {
                    currentWord += char;
                    wordEnd = ends[i];
                }
            }

            const phraseGroups = [];
            let tempGroup = [];

            for (let i = 0; i < wordList.length; i++) {
                tempGroup.push(wordList[i]);
                if (tempGroup.length >= 2 || i === wordList.length - 1 || wordList[i].word.includes(".") || wordList[i].word.includes("?")) {
                    phraseGroups.push({
                        words: [...tempGroup],
                        start: tempGroup[0].start,
                        end: tempGroup[tempGroup.length - 1].end
                    });
                    tempGroup = [];
                }
            }

            return phraseGroups;
        }

        function drawCanvasFrame(time, activePhrase, currentSceneIdx = 0) {
            const w = canvas.width;
            const h = canvas.height;

            const currentScene = scenes[currentSceneIdx] || scenes[0];

            // 1. Ken Burns Zoom Effect Calculation
            ctx.save();
            const scale = 1.0 + (time * 0.04) % 0.15; // Slow continuous zoom in
            ctx.translate(w / 2, h / 2);
            ctx.scale(scale, scale);
            ctx.translate(-w / 2, -h / 2);

            if (currentScene && currentScene.media) {
                if (currentScene.isVideo && currentScene.media.readyState >= 2) {
                    ctx.drawImage(currentScene.media, 0, 0, w, h);
                } else if (!currentScene.isVideo) {
                    ctx.drawImage(currentScene.media, 0, 0, w, h);
                }
            } else {
                // Procedural Nightline Creepy Background
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#0a030d');
                grad.addColorStop(0.5, '#050711');
                grad.addColorStop(1, '#020205');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);
            }
            ctx.restore();

            // Dark Nightline Contrast Overlay & Vignette
            const vignette = ctx.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, h * 0.75);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0.25)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.88)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);

            // 2. Render Nightline Center Animated Captions
            if (activePhrase && activePhrase.words && activePhrase.words.length > 0) {
                drawNightlineCaptions(activePhrase, time);
            }
        }

        function drawNightlineCaptions(phrase, currentTime) {
            ctx.save();

            const style = subtitleStyleSelect.value;
            const words = phrase.words;
            const lineY = canvas.height * 0.50; // Centered for Nightline Horror Short style
            
            ctx.font = '900 92px "Montserrat", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let totalWidth = 0;
            const wordMetrics = words.map(wObj => {
                const width = ctx.measureText(wObj.word).width;
                totalWidth += width;
                return { ...wObj, width };
            });

            const gap = 32;
            totalWidth += gap * (words.length - 1);
            let startX = (canvas.width - totalWidth) / 2;

            // Ambient dark backing box for readability
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.filter = 'blur(15px)';
            ctx.beginPath();
            ctx.roundRect((canvas.width - totalWidth) / 2 - 30, lineY - 70, totalWidth + 60, 140, 24);
            ctx.fill();
            ctx.filter = 'none';

            wordMetrics.forEach((wObj) => {
                const isActive = currentTime >= wObj.start && currentTime <= wObj.end + 0.05;
                const wordCenterX = startX + wObj.width / 2;

                ctx.save();
                ctx.translate(wordCenterX, lineY);

                if (isActive) {
                    const activeProgress = Math.min((currentTime - wObj.start) / 0.1, 1);
                    const scale = 1.0 + Math.sin(activeProgress * Math.PI) * 0.18;
                    ctx.scale(scale, scale);
                }

                ctx.shadowColor = 'rgba(0, 0, 0, 0.95)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 8;

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 14;
                ctx.strokeText(wObj.word, 0, 0);

                if (style === 'nightline') {
                    ctx.fillStyle = isActive ? '#facc15' : '#ffffff'; // Neon Yellow
                } else if (style === 'hormozi') {
                    ctx.fillStyle = isActive ? '#22c55e' : '#ffffff'; // Emerald
                } else {
                    ctx.fillStyle = isActive ? '#00f2fe' : '#ffffff'; // Cyan
                }

                ctx.fillText(wObj.word, 0, 0);

                ctx.restore();

                startX += wObj.width + gap;
            });

            ctx.restore();
        }

        // Web Audio Synth Creepy BGM Generator
        function playCreepyBGM(audioCtx) {
            const bgmType = bgmSelect.value;
            if (bgmType === 'none') return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(55, audioCtx.currentTime); // Low creepy A1 pitch
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        // Main Generation Workflow
        async function generateShortVideoPro() {
            const apiKey = apiKeyInput.value.trim();
            const voiceId = voiceSelect.value;
            const scriptText = scriptInput.value.trim();

            if (!apiKey) {
                updateStatus("Please enter your ElevenLabs API Key!", "error");
                return;
            }
            if (!scriptText) {
                updateStatus("Please enter a voiceover script!", "error");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            downloadLink.classList.add('hidden');
            liveStatusText.innerText = "Syncing...";

            try {
                updateStatus("🎙️ Requesting ElevenLabs TTS with precise word timings...");
                const { audioUrl, wordTimings } = await fetchElevenLabsWithTimestamps(scriptText, apiKey, voiceId);

                updateStatus("🔊 Audio loaded! Initializing Web Audio & BGM Engine...");
                const audio = new Audio(audioUrl);
                await new Promise(resolve => audio.onloadedmetadata = resolve);

                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(audio);
                const audioDest = audioCtx.createMediaStreamDestination();

                source.connect(audioDest);
                source.connect(audioCtx.destination);
                playCreepyBGM(audioCtx);

                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...audioDest.stream.getAudioTracks()
                ]);

                let mediaRecorder;
                const recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch(e) {
                    mediaRecorder = new MediaRecorder(combinedStream);
                }

                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadLink.classList.remove('hidden');
                    updateStatus("✅ Multi-Scene Short generated successfully!", "success");
                    liveStatusText.innerText = "Completed";
                    generateBtn.disabled = false;
                    generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                };

                mediaRecorder.start();
                audio.play();
                liveStatusText.innerText = "Recording...";
                updateStatus("🎥 Recording 9:16 Video stream with multi-scene transitions...");

                const totalDuration = audio.duration;
                const startTime = Date.now();

                function renderLoop() {
                    const elapsed = (Date.now() - startTime) / 1000;

                    // Multi-scene timing split
                    const currentSceneIdx = Math.min(Math.floor((elapsed / totalDuration) * scenes.length), scenes.length - 1);

                    const activePhrase = wordTimings.find(p => elapsed >= p.start && elapsed <= p.end) || 
                                         wordTimings.find(p => elapsed < p.start) || 
                                         wordTimings[wordTimings.length - 1];

                    drawCanvasFrame(elapsed, activePhrase, currentSceneIdx);

                    if (!audio.ended && elapsed < totalDuration + 0.3) {
                        renderAnimationId = requestAnimationFrame(renderLoop);
                    } else {
                        cancelAnimationFrame(renderAnimationId);
                        if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                    }
                }

                renderLoop();

            } catch (err) {
                console.error(err);
                updateStatus(err.message || "Failed to generate video.", "error");
                liveStatusText.innerText = "Error";
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        window.onload = () => {
            drawCanvasFrame(0, {
                words: [
                    { word: "NIGHTLINE 🤡", start: 0, end: 1 },
                    { word: "HORROR 👻", start: 0, end: 1 }
                ]
            }, 0);
        };
    </script>
