<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horror Shorts Studio Pro - Perfect Auto-Wrap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #080b12; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { color: #e11d48; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-weight: 900; }
        .app-layout { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1200px; width: 100%; justify-content: center; }
        .panel { flex: 1; min-width: 340px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 25px; }
        label { display: block; font-size: 12px; font-weight: 800; color: #f43f5e; margin-top: 15px; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea, button { width: 100%; padding: 12px; background: #030712; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; }
        textarea { height: 130px; resize: vertical; line-height: 1.5; }
        button { background: linear-gradient(135deg, #e11d48 0%, #9f1239 100%); font-weight: 900; font-size: 16px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 15px; }
        button:hover { opacity: 0.9; }
        .canvas-container { display: flex; flex-direction: column; align-items: center; background: #000; padding: 15px; border-radius: 20px; border: 2px solid #27272a; }
        canvas { width: 320px; height: 568px; border-radius: 12px; box-shadow: 0 0 30px rgba(225, 29, 72, 0.3); }
        .status { margin-top: 15px; color: #fbbf24; font-weight: 700; text-align: center; }
        #downloadBtn { display: none; background: #16a34a; text-decoration: none; width: 100%; margin-top: 15px; }
        #downloadBtn button { background: #16a34a; margin-top: 0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
</head>
<body>

    <h1>👻 Viral Horror Shorts Studio</h1>

    <div class="app-layout">
        <div class="panel">
            <label>1. ElevenLabs API Raktas:</label>
            <input type="password" id="apiKey" placeholder="Įklijuokite savo sk_... API raktą">

            <label>2. Pasirinkite Balsą:</label>
            <select id="voiceId">
                <option value="JBFqnCBsd6RMkjVDRZzb">George (Gilus, tamsus narratorius)</option>
                <option value="pNInz6obpgDQGcFmaJgB">Adam (Classic Storyteller)</option>
            </select>

            <label>3. Įkelkite Fono Vaizdą arba Video (.mp4):</label>
            <input type="file" id="bgFile" accept="image/*,video/*">

            <label>4. Baisi Istorija (su Emojis):</label>
            <textarea id="script">In the 1970s, parents hired a clown 🤡 for kids birthday parties 🎈. He called himself Pogo 🎭, made balloon animals 🎈, and told jokes 🤣. Everyone laughed 😆. Then young boys started disappearing 🕳️... Years later, police discovered a crawl space under his house 🏚️. The clown's real name was John Wayne Gacy ⚠️. He wasn't a clown 🤡... He was a monster 👹.</textarea>

            <button id="startBtn" onclick="generateHorrorShort()">⚡ GENERUOTI HORROR SHORT</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="horror_short.webm"><button>⬇️ ATSISIŲSTI VIDEO</button></a>
        </div>

        <div class="panel canvas-container">
            <canvas id="shortCanvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('shortCanvas');
        const ctx = canvas.getContext('2d');
        let bgMedia = null;
        let isVideo = false;

        document.getElementById('bgFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                bgMedia = document.createElement('video');
                bgMedia.src = url;
                bgMedia.loop = true;
                bgMedia.muted = true;
                bgMedia.playsInline = true;
                bgMedia.play();
                isVideo = true;
            } else {
                bgMedia = new Image();
                bgMedia.src = url;
                isVideo = false;
            }
        });

        function createCreepyAmbientSound(audioCtx) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(55, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            osc.connect(gain);
            return gain;
        }

        // Teksto skaldymo į eilutes funkcija
        function wrapText(context, text, maxWidth) {
            const words = text.split(' ');
            let lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                let word = words[i];
                let width = context.measureText(currentLine + " " + word).width;
                if (width < maxWidth) {
                    currentLine += " " + word;
                } else {
                    lines.push(currentLine);
                    currentLine = word;
                }
            }
            lines.push(currentLine);
            return lines;
        }

        async function generateHorrorShort() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const voiceId = document.getElementById('voiceId').value;
            const scriptText = document.getElementById('script').value.trim();
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!apiKey) return alert("Įveskite ElevenLabs API raktą!");
            if (!scriptText) return alert("Įveskite tekstą!");

            status.innerText = "🎙️ Generuojamas tamsus ElevenLabs įgarsinimas...";
            downloadBtn.style.display = 'none';

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'xi-api-key': apiKey
                    },
                    body: JSON.stringify({
                        text: scriptText.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, ''),
                        model_id: "eleven_multilingual_v2"
                    })
                });

                if (!response.ok) throw new Error("API Klaida. Patikrinkite raktą.");

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                const voiceAudio = new Audio(audioUrl);

                await new Promise(res => voiceAudio.onloadedmetadata = res);

                const voiceSource = audioCtx.createMediaElementSource(voiceAudio);
                const dest = audioCtx.createMediaStreamDestination();

                const ambientGain = createCreepyAmbientSound(audioCtx);
                ambientGain.connect(dest);
                ambientGain.connect(audioCtx.destination);

                voiceSource.connect(dest);
                voiceSource.connect(audioCtx.destination);

                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...dest.stream.getAudioTracks()
                ]);

                const mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const finalBlob = new Blob(chunks, { type: 'video/webm' });
                    downloadBtn.href = URL.createObjectURL(finalBlob);
                    downloadBtn.style.display = 'block';
                    status.innerText = "✅ Video paruoštas atsisiuntimui!";
                };

                // Daliname tekstą į frazes po ~3 žodžius
                const words = scriptText.split(/\s+/);
                const textSegments = [];
                let temp = [];
                for (let i = 0; i < words.length; i++) {
                    temp.push(words[i]);
                    if (temp.length >= 3 || i === words.length - 1) {
                        textSegments.push(temp.join(" "));
                        temp = [];
                    }
                }

                mediaRecorder.start();
                voiceAudio.play();
                status.innerText = "🎥 Įrašomas 9:16 Shorts Video...";

                const duration = voiceAudio.duration;
                const startTime = Date.now();

                function renderLoop() {
                    const elapsed = (Date.now() - startTime) / 1000;
                    const progress = Math.min(elapsed / duration, 0.99);
                    const currentSegIdx = Math.floor(progress * textSegments.length);
                    const currentText = (textSegments[currentSegIdx] || textSegments[textSegments.length - 1]).toUpperCase();

                    // 1. FONAS
                    if (bgMedia) {
                        ctx.drawImage(bgMedia, 0, 0, canvas.width, canvas.height);
                    } else {
                        let grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 100, canvas.width/2, canvas.height/2, 1000);
                        grad.addColorStop(0, '#1c0509');
                        grad.addColorStop(1, '#000000');
                        ctx.fillStyle = grad;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    // Tamsinimas
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // 2. SAUGUS TEKSTO RENDERINIMAS (AUTO-WRAP + RESIZE)
                    const maxAllowedWidth = canvas.width - 160; // 80px paraštės iš šonų
                    let fontSize = 70;
                    ctx.font = `900 ${fontSize}px 'Montserrat', sans-serif`;

                    let lines = wrapText(ctx, currentText, maxAllowedWidth);

                    // Jei net ir padalinus į eilutes netelpa (pvz. per didelis aukštis), mažiname šriftą
                    while (lines.some(line => ctx.measureText(line).width > maxAllowedWidth) && fontSize > 35) {
                        fontSize -= 4;
                        ctx.font = `900 ${fontSize}px 'Montserrat', sans-serif`;
                        lines = wrapText(ctx, currentText, maxAllowedWidth);
                    }

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const lineHeight = fontSize * 1.2;
                    const startY = (canvas.height / 2) - ((lines.length - 1) * lineHeight / 2);

                    lines.forEach((line, index) => {
                        const y = startY + (index * lineHeight);

                        // Juodas kraštas (Outline)
                        ctx.lineWidth = 14;
                        ctx.strokeStyle = '#000000';
                        ctx.strokeText(line, canvas.width / 2, y);

                        // Baltas tekstas
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillText(line, canvas.width / 2, y);
                    });

                    if (!voiceAudio.ended && elapsed < duration + 0.3) {
                        requestAnimationFrame(renderLoop);
                    } else {
                        mediaRecorder.stop();
                    }
                }

                renderLoop();

            } catch (err) {
                console.error(err);
                status.innerText = "❌ Klaida: " + err.message;
            }
        }
    </script>
</body>
</html>
