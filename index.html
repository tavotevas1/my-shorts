<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Viral Short Creator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 26px; font-weight: 800; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1000px; width: 100%; justify-content: center; }
        .controls { flex: 1; min-width: 320px; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; }
        .preview { flex: 1; min-width: 320px; display: flex; flex-direction: column; align-items: center; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; font-size: 13px; text-transform: uppercase; }
        textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 14px; height: 120px; resize: vertical; }
        button { width: 100%; margin-top: 20px; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        canvas { border-radius: 12px; border: 3px solid #38bdf8; max-width: 280px; max-height: 497px; width: 100%; height: auto; background: #000; box-shadow: 0 0 20px rgba(56,189,248,0.2); }
        #downloadBtn { background: #16a34a; display: none; margin-top: 15px; text-decoration: none; }
        #downloadBtn button { margin-top: 0; }
        .status { margin-top: 12px; font-size: 14px; color: #f59e0b; text-align: center; font-weight: 700; }
    </style>
</head>
<body>

    <h1>🎬 Auto-Context Viral Shorts Generator</h1>

    <div class="container">
        <div class="controls">
            <label for="script">Story Script (English):</label>
            <textarea id="script">Did you know about Harrison Okene? In 2013, a tugboat capsized in the Atlantic ocean. Harrison was trapped inside a dark sunken ship deep underwater for three whole days. Miraculously, divers found him alive in a tiny air pocket!</textarea>

            <button id="generateBtn" onclick="generateShort()">⚡ Generate Viral Short Video</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="viral_short.webm"><button style="background:#16a34a;">⬇️ Download Video</button></a>
        </div>

        <div class="preview">
            <h3>Vertical Preview (9:16)</h3>
            <canvas id="videoCanvas" width="1080" height="1920"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;

        function generateShort() {
            const scriptText = document.getElementById('script').value.trim();
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.style.display = 'none';

            if (!scriptText) return alert("Please enter text!");

            status.innerText = "🎙️ Synthesizing Voice & Generating Scenes...";

            const words = scriptText.split(' ');
            const chunks = [];
            for (let i = 0; i < words.length; i += 3) {
                chunks.push(words.slice(i, i + 3).join(' '));
            }

            const synth = window.speechSynthesis;
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(scriptText);
            const voices = synth.getVoices().filter(v => v.lang.startsWith('en'));
            if (voices.length > 0) {
                utterance.voice = voices.find(v => v.name.includes("Google") || v.name.includes("Natural")) || voices[0];
            }
            utterance.pitch = 0.9;
            utterance.rate = 0.95;

            const stream = canvas.captureStream(30);
            let mediaRecorder;
            const recordedChunks = [];

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            } catch(e) {
                mediaRecorder = new MediaRecorder(stream);
            }

            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                status.innerText = "✅ Done! Click below to download your short.";
            };

            mediaRecorder.start();
            const startTime = Date.now();
            const durationPerChunk = 1.2;

            synth.speak(utterance);

            function render() {
                const elapsed = (Date.now() - startTime) / 1000;
                const chunkIndex = Math.min(Math.floor(elapsed / durationPerChunk), chunks.length - 1);
                const currentText = chunks[chunkIndex] || "";

                // Dynamic Animated Background (Ocean / Dark Atmosphere Theme)
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                const pulse = Math.sin(elapsed * 2) * 20;
                grad.addColorStop(0, `rgb(10, ${20 + pulse}, 40)`);
                grad.addColorStop(1, `rgb(5, 10, ${25 + pulse})`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Animated Light Overlay Waves
                ctx.fillStyle = 'rgba(56, 189, 248, 0.08)';
                for (let i = 0; i < 5; i++) {
                    ctx.beginPath();
                    ctx.arc(canvas.width / 2 + Math.sin(elapsed + i) * 200, (i * 350) + Math.cos(elapsed) * 50, 400, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Subtitle Box Frame
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.beginPath();
                ctx.roundRect(100, canvas.height / 2 - 140, canvas.width - 200, 280, 24);
                ctx.fill();

                // Draw Text
                ctx.font = 'bold 72px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#facc15';
                ctx.fillText(currentText.toUpperCase(), canvas.width / 2, canvas.height / 2);

                if (elapsed < (chunks.length * durationPerChunk) + 0.5 || synth.speaking) {
                    animationId = requestAnimationFrame(render);
                } else {
                    synth.cancel();
                    mediaRecorder.stop();
                    cancelAnimationFrame(animationId);
                }
            }

            render();
        }
    </script>
</body>
</html>
