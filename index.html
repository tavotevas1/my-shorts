<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowShorts AI Studio - SDK Edition</title>
    <!-- ElevenLabs JS SDK per CDN -->
    <script src="https://unpkg.com/elevenlabs/dist/index.umd.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #38bdf8; text-align: center; font-size: 26px; font-weight: 800; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1100px; width: 100%; justify-content: center; }
        .controls, .preview { flex: 1; min-width: 340px; background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937; }
        .preview { display: flex; flex-direction: column; align-items: center; }
        label { display: block; margin-top: 15px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; font-size: 13px; text-transform: uppercase; }
        textarea, input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #030712; color: #fff; font-size: 14px; }
        textarea { height: 110px; resize: vertical; }
        button { margin-top: 20px; padding: 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        canvas { border-radius: 12px; border: 3px solid #38bdf8; max-width: 300px; height: auto; background: #000; box-shadow: 0 0 25px rgba(56,189,248,0.25); }
        #downloadBtn { background: #16a34a; display: none; margin-top: 15px; text-decoration: none; width: 100%; text-align: center; }
        #downloadBtn button { margin-top: 0; background: #16a34a; }
        .status { margin-top: 12px; font-size: 14px; color: #f59e0b; text-align: center; font-weight: 700; }
    </style>
</head>
<body>

    <h1>🎬 FlowShorts AI Studio</h1>

    <div class="container">
        <div class="controls">
            <label for="apiKey">1. ElevenLabs API Raktas:</label>
            <input type="password" id="apiKey" placeholder="Įklijuokite savo ElevenLabs API Key...">

            <label for="voiceSelect">2. Pasirinkite AI Balsą:</label>
            <select id="voiceSelect">
                <option value="JBFqnCBsd6RMkjVDRZzb">George (Gilus ir dramatiškas)</option>
                <option value="pNInz6obpgDQGcFmaJgB">Adam (Deep & Storyteller)</option>
                <option value="21m00Tcm4TlvDq8ikWAM">Rachel (Calm & Clear)</option>
                <option value="ErXwobaYiN019PkySvjV">Antoni (Narrator)</option>
            </select>

            <label for="bgFile">3. Fono Vaizdo Įrašas (.mp4) arba Nuotrauka:</label>
            <input type="file" id="bgFile" accept="video/*,image/*">

            <label for="script">4. Video Tekstas / Scenarijus:</label>
            <textarea id="script">The first move is what sets everything in motion.</textarea>

            <button id="generateBtn" onclick="generateShort()">⚡ Generuoti Shorts Video</button>
            <div id="status" class="status"></div>
            <a id="downloadBtn" download="flowshorts_video.webm"><button>⬇️ Atsisiųsti Paruoštą Video</button></a>
        </div>

        <div class="preview">
            <h3>9:16 Vertikalus Peržiūros Langas</h3>
            <canvas id="videoCanvas" width="1080" height="1920" style="margin-top:15px;"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        let bgMedia = null;
        let isVideo = false;

        document.getElementById('bgFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                bgMedia = document.createElement('video');
                bgMedia.src = url;
                bgMedia.loop = true;
                bgMedia.muted = true;
                bgMedia.playsInline = true;
                bgMedia.onloadedmetadata = () => {
                    bgMedia.play().catch(e => console.log(e));
                };
                isVideo = true;
            } else {
                bgMedia = new Image();
                bgMedia.src = url;
                isVideo = false;
            }
        });

        // ElevenLabs įgarsinimo funkcija naudojant jūsų pateiktą kodo struktūrą
        async function fetchElevenLabsAudio(text, apiKey, voiceId) {
            // Inicializuojame ElevenLabs klientą
            const client = new ElevenLabs.ElevenLabsClient({ apiKey: apiKey });

            // Kviečiame konvertavimo metodą pagal jūsų pavyzdį
            const audioStream = await client.textToSpeech.convert(voiceId, {
                text: text,
                modelId: 'eleven_multilingual_v2',
                outputFormat: 'mp3_44100_128'
            });

            // Stream duomenų konvertavimas į naršyklei tinkamą Blob / URL
            const reader = audioStream.getReader();
            const chunks = [];
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
            }

            const blob = new Blob(chunks, { type: 'audio/mp3' });
            return URL.createObjectURL(blob);
        }

        async function generateShort() {
            const scriptText = document.getElementById('script').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const voiceId = document.getElementById('voiceSelect').value;
            const status = document.getElementById('status');
            const downloadBtn = document.getElementById('downloadBtn');

            if (!scriptText) return alert("Įveskite tekstą!");
            if (!apiKey) return alert("Prašome įvesti ElevenLabs API Raktą!");

            if (isVideo && bgMedia) {
                try { await bgMedia.play(); } catch(e) {}
            }

            downloadBtn.style.display = 'none';
            status.innerText = "🎙️ Generuojamas ElevenLabs AI balsas...";

            let audioUrl;
            try {
                audioUrl = await fetchElevenLabsAudio(scriptText, apiKey, voiceId);
            } catch (err) {
                console.error(err);
                status.innerText = "❌ Klaida: Patikrinkite API Raktą arba konsolę.";
                return;
            }

            const audio = new Audio(audioUrl);
            await new Promise(resolve => audio.onloadedmetadata = resolve);

            // Garso nukreipimas į vaizdo įrašymo srautą
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const dest = audioCtx.createMediaStreamDestination();
            source.connect(dest);
            source.connect(audioCtx.destination);

            const canvasStream = canvas.captureStream(30);
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
            ]);

            // Teksto dalinimas į trumpas frazes (3 žodžiai)
            const allWords = scriptText.toUpperCase().split(/\s+/);
            const chunks = [];
            let currentChunk = [];

            for (let i = 0; i < allWords.length; i++) {
                currentChunk.push(allWords[i]);
                if (currentChunk.length >= 3 || i === allWords.length - 1) {
                    chunks.push(currentChunk.join(" "));
                    currentChunk = [];
                }
            }

            let mediaRecorder;
            const recordedChunks = [];

            try {
                mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
            } catch(e) {
                mediaRecorder = new MediaRecorder(combinedStream);
            }

            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                downloadBtn.href = URL.createObjectURL(blob);
                downloadBtn.style.display = 'block';
                status.innerText = "✅ Video sugeneruotas sėkmingai!";
            };

            mediaRecorder.start();
            audio.play();
            status.innerText = "🎥 Įrašomas vaizdas ir garsas...";

            const audioDuration = audio.duration;
            const startTime = Date.now();

            function render() {
                const elapsed = (Date.now() - startTime) / 1000;
                const progress = Math.min(elapsed / audioDuration, 0.99);
                const currentChunkIdx = Math.floor(progress * chunks.length);
                const activeText = chunks[currentChunkIdx] || chunks[chunks.length - 1];

                // Fonas
                if (bgMedia) {
                    if (isVideo && bgMedia.readyState >= 2) {
                        ctx.drawImage(bgMedia, 0, 0, canvas.width, canvas.height);
                    } else if (!isVideo) {
                        ctx.drawImage(bgMedia, 0, 0, canvas.width, canvas.height);
                    }
                } else {
                    let grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                    grad.addColorStop(0, '#0f172a');
                    grad.addColorStop(1, '#1e1b4b');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Tamsinimas
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Dinaminiai Subtitrai
                const maxWidth = canvas.width - 120;
                let fontSize = 70;
                ctx.font = `900 ${fontSize}px Arial, sans-serif`;

                while (ctx.measureText(activeText).width > maxWidth && fontSize > 35) {
                    fontSize -= 5;
                    ctx.font = `900 ${fontSize}px Arial, sans-serif`;
                }

                const textWidth = ctx.measureText(activeText).width;
                const boxWidth = textWidth + 80;
                const boxHeight = fontSize * 1.8;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
                ctx.beginPath();
                ctx.roundRect((canvas.width - boxWidth) / 2, canvas.height / 2 - (boxHeight / 2), boxWidth, boxHeight, 16);
                ctx.fill();

                ctx.lineWidth = 5;
                ctx.strokeStyle = '#facc15';
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                ctx.lineWidth = 8;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(activeText, canvas.width / 2, canvas.height / 2);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(activeText, canvas.width / 2, canvas.height / 2);

                if (!audio.ended && elapsed < audioDuration + 0.5) {
                    requestAnimationFrame(render);
                } else {
                    mediaRecorder.stop();
                }
            }

            render();
        }
    </script>
</body>
</html>
