    <video id="bgVideoElement" class="hidden" loop muted playsinline></video>

    <script>
        // DOM Elements
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const apiKeyInput = document.getElementById('apiKey');
        const voiceSelect = document.getElementById('voiceSelect');
        const subtitleStyleSelect = document.getElementById('subtitleStyleSelect');
        const bgFileInput = document.getElementById('bgFileInput');
        const scriptInput = document.getElementById('scriptInput');
        const generateBtn = document.getElementById('generateBtn');
        const statusBox = document.getElementById('statusBox');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const downloadLink = document.getElementById('downloadLink');
        const liveStatusText = document.getElementById('liveStatusText');
        const bgVideoElement = document.getElementById('bgVideoElement');

        // State Variables
        let customMedia = null;
        let isVideoMedia = false;
        let renderAnimationId = null;

        // Custom Background Upload Handler
        bgFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);
            if (file.type.startsWith('video/')) {
                bgVideoElement.src = url;
                bgVideoElement.onloadedmetadata = () => {
                    bgVideoElement.play().catch(err => console.log('Video play error:', err));
                };
                customMedia = bgVideoElement;
                isVideoMedia = true;
            } else {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    customMedia = img;
                    isVideoMedia = false;
                    drawCanvasFrame(0, null);
                };
            }
        });

        function updateStatus(message, type = 'info') {
            statusBox.classList.remove('hidden', 'bg-red-500/10', 'text-red-400', 'border-red-500/20', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/20', 'bg-slate-900', 'text-amber-400', 'border-slate-800');
            
            if (type === 'error') {
                statusBox.classList.add('bg-red-500/10', 'text-red-400', 'border', 'border-red-500/20');
                statusIcon.className = 'fa-solid fa-triangle-exclamation text-sm';
            } else if (type === 'success') {
                statusBox.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/20');
                statusIcon.className = 'fa-solid fa-circle-check text-sm';
            } else {
                statusBox.classList.add('bg-slate-900', 'text-amber-400', 'border', 'border-slate-800');
                statusIcon.className = 'fa-solid fa-circle-notch animate-spin text-sm';
            }

            statusText.innerText = message;
        }

        // Fetches TTS with word-level timestamps using with_timestamps endpoint
        async function fetchElevenLabsWithTimestamps(text, apiKey, voiceId) {
            const cleanKey = apiKey.trim();
            const cleanVoice = voiceId.trim();

            const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${cleanVoice}/with-timestamps`, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'xi-api-key': cleanKey
                },
                body: JSON.stringify({
                    text: text,
                    model_id: "eleven_multilingual_v2",
                    voice_settings: {
                        stability: 0.5,
                        similarity_boost: 0.75
                    }
                })
            });

            if (!response.ok) {
                const errJson = await response.json().catch(() => ({}));
                const errMsg = errJson?.detail?.message || `ElevenLabs API Error: ${response.status} ${response.statusText}`;
                throw new Error(errMsg);
            }

            const data = await response.json();
            
            // Reconstruct Audio URL from Base64
            const audioBytes = atob(data.audio_base64);
            const arrayBuffer = new ArrayBuffer(audioBytes.length);
            const uint8Array = new Uint8Array(arrayBuffer);
            for (let i = 0; i < audioBytes.length; i++) {
                uint8Array[i] = audioBytes.charCodeAt(i);
            }
            const audioBlob = new Blob([uint8Array], { type: 'audio/mpeg' });
            const audioUrl = URL.createObjectURL(audioBlob);

            // Process alignment data to create word-level start/end timing arrays
            const wordTimings = processAlignmentToWordTimings(data.alignment);

            return { audioUrl, wordTimings };
        }

        // Align character timestamps into words
        function processAlignmentToWordTimings(alignment) {
            if (!alignment || !alignment.characters) return [];

            const chars = alignment.characters;
            const starts = alignment.character_start_times_seconds;
            const ends = alignment.character_end_times_seconds;

            const wordList = [];
            let currentWord = "";
            let wordStart = null;
            let wordEnd = null;

            for (let i = 0; i < chars.length; i++) {
                const char = chars[i];
                if (wordStart === null && char.trim() !== "") {
                    wordStart = starts[i];
                }

                if (char === " " || char === "\n" || i === chars.length - 1) {
                    if (i === chars.length - 1 && char.trim() !== "") {
                        currentWord += char;
                        wordEnd = ends[i];
                    } else if (i > 0) {
                        wordEnd = ends[i - 1];
                    }

                    if (currentWord.trim().length > 0) {
                        wordList.push({
                            word: currentWord.trim().toUpperCase(),
                            start: wordStart !== null ? wordStart : 0,
                            end: wordEnd !== null ? wordEnd : wordStart + 0.3
                        });
                    }

                    currentWord = "";
                    wordStart = null;
                    wordEnd = null;
                } else {
                    currentWord += char;
                    wordEnd = ends[i];
                }
            }

            // Group into 2-3 word logical subtitle phrases for clean TikTok formatting
            const phraseGroups = [];
            let tempGroup = [];

            for (let i = 0; i < wordList.length; i++) {
                tempGroup.push(wordList[i]);
                if (tempGroup.length >= 3 || i === wordList.length - 1 || wordList[i].word.includes(".") || wordList[i].word.includes("?")) {
                    phraseGroups.push({
                        words: [...tempGroup],
                        start: tempGroup[0].start,
                        end: tempGroup[tempGroup.length - 1].end
                    });
                    tempGroup = [];
                }
            }

            return phraseGroups;
        }

        function drawCanvasFrame(time, activePhrase) {
            const w = canvas.width;
            const h = canvas.height;

            // 1. Background
            if (customMedia) {
                if (isVideoMedia && bgVideoElement.readyState >= 2) {
                    ctx.drawImage(bgVideoElement, 0, 0, w, h);
                } else if (!isVideoMedia) {
                    ctx.drawImage(customMedia, 0, 0, w, h);
                }
            } else {
                // Sleek Gradient Background
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#0a0f1d');
                grad.addColorStop(0.5, '#070a14');
                grad.addColorStop(1, '#020307');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Subtle particle dots
                for (let i = 0; i < 20; i++) {
                    const px = (Math.sin(i * 99 + time * 0.5) * 0.5 + 0.5) * w;
                    const py = (Math.cos(i * 33 + time * 0.3) * 0.5 + 0.5) * h;
                    ctx.beginPath();
                    ctx.arc(px, py, (i % 3 + 1) * 4, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(0, 242, 254, 0.15)' : 'rgba(124, 58, 237, 0.15)';
                    ctx.fill();
                }
            }

            // Dark subtle vignette gradient for video readability
            const vignette = ctx.createRadialGradient(w / 2, h / 2, h * 0.2, w / 2, h / 2, h * 0.7);
            vignette.addColorStop(0, 'rgba(0, 0, 0, 0.1)');
            vignette.addColorStop(1, 'rgba(0, 0, 0, 0.75)');
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, w, h);

            // 2. Render Modern High-Retention Subtitles
            if (activePhrase && activePhrase.words && activePhrase.words.length > 0) {
                drawModernCaptions(activePhrase, time);
            }
        }

        // Modern Alex Hormozi / MrBeast Style Subtitles (Pop-in active word)
        function drawModernCaptions(phrase, currentTime) {
            ctx.save();

            const style = subtitleStyleSelect.value;
            const words = phrase.words;
            const lineY = canvas.height * 0.65;
            
            ctx.font = '900 84px "Montserrat", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Calculate total width of phrase for centering
            let totalWidth = 0;
            const wordMetrics = words.map(wObj => {
                const width = ctx.measureText(wObj.word).width;
                totalWidth += width;
                return { ...wObj, width };
            });

            const gap = 28;
            totalWidth += gap * (words.length - 1);

            let startX = (canvas.width - totalWidth) / 2;

            // Render subtle dark ambient blur box under current phrase (No heavy borders)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.filter = 'blur(20px)';
            ctx.beginPath();
            ctx.roundRect((canvas.width - totalWidth) / 2 - 40, lineY - 60, totalWidth + 80, 120, 30);
            ctx.fill();
            ctx.filter = 'none';

            // Render Words with Pop-in scale animation for active word
            wordMetrics.forEach((wObj) => {
                const isActive = currentTime >= wObj.start && currentTime <= wObj.end + 0.05;
                const wordCenterX = startX + wObj.width / 2;

                ctx.save();
                ctx.translate(wordCenterX, lineY);

                if (isActive) {
                    // Pop-in spring scale
                    const activeProgress = Math.min((currentTime - wObj.start) / 0.1, 1);
                    const scale = 1.0 + Math.sin(activeProgress * Math.PI) * 0.12;
                    ctx.scale(scale, scale);
                }

                // Shadow & Stroke
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 6;

                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 12;
                ctx.strokeText(wObj.word, 0, 0);

                // Color Schemes
                if (style === 'hormozi') {
                    ctx.fillStyle = isActive ? '#22c55e' : '#ffffff'; // Vibrant Emerald Green for active word
                } else if (style === 'mrbeast') {
                    ctx.fillStyle = isActive ? '#facc15' : '#ffffff'; // Neon Yellow
                } else {
                    ctx.fillStyle = isActive ? '#00f2fe' : '#e2e8f0'; // Cyan
                }

                ctx.fillText(wObj.word, 0, 0);

                ctx.restore();

                startX += wObj.width + gap;
            });

            ctx.restore();
        }

        async function generateShortVideo() {
            const apiKey = apiKeyInput.value.trim();
            const voiceId = voiceSelect.value;
            const scriptText = scriptInput.value.trim();

            if (!apiKey) {
                updateStatus("Please enter your ElevenLabs API Key!", "error");
                return;
            }
            if (!scriptText) {
                updateStatus("Please enter a voiceover script!", "error");
                return;
            }

            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
            downloadLink.classList.add('hidden');
            liveStatusText.innerText = "Syncing Speech...";

            try {
                updateStatus("🎙️ Requesting ElevenLabs TTS with word-level timestamps...");
                
                // 1. Fetch ElevenLabs Speech with Timestamps
                const { audioUrl, wordTimings } = await fetchElevenLabsWithTimestamps(scriptText, apiKey, voiceId);
                
                if (!wordTimings || wordTimings.length === 0) {
                    throw new Error("Failed to extract word timings from ElevenLabs API.");
                }

                updateStatus("🔊 Timestamps aligned! Setting up canvas recorder...");
                
                const audio = new Audio(audioUrl);
                await new Promise(resolve => audio.onloadedmetadata = resolve);

                // 2. Setup Web Audio Destination
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(audio);
                const audioDest = audioCtx.createMediaStreamDestination();
                source.connect(audioDest);
                source.connect(audioCtx.destination);

                // 3. Media Stream Capture
                const canvasStream = canvas.captureStream(30);
                const combinedStream = new MediaStream([
                    ...canvasStream.getVideoTracks(),
                    ...audioDest.stream.getAudioTracks()
                ]);

                // 4. MediaRecorder Setup
                let mediaRecorder;
                const recordedChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp9' });
                } catch(e) {
                    mediaRecorder = new MediaRecorder(combinedStream);
                }

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadLink.classList.remove('hidden');
                    updateStatus("✅ Viral Short generated & ready for download!", "success");
                    liveStatusText.innerText = "Completed";
                    
                    generateBtn.disabled = false;
                    generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                };

                // 5. Playback & Recording Loop
                if (isVideoMedia && bgVideoElement) {
                    bgVideoElement.currentTime = 0;
                    bgVideoElement.play().catch(e => console.log(e));
                }

                mediaRecorder.start();
                audio.play();
                liveStatusText.innerText = "Recording...";
                updateStatus("🎥 Recording 9:16 Video stream with active word sync...");

                const totalDuration = audio.duration;
                const startTime = Date.now();

                function renderLoop() {
                    const elapsed = (Date.now() - startTime) / 1000;

                    // Find active word phrase based on current audio time
                    const activePhrase = wordTimings.find(p => elapsed >= p.start && elapsed <= p.end) || 
                                         wordTimings.find(p => elapsed < p.start) || 
                                         wordTimings[wordTimings.length - 1];

                    drawCanvasFrame(elapsed, activePhrase);

                    if (!audio.ended && elapsed < totalDuration + 0.3) {
                        renderAnimationId = requestAnimationFrame(renderLoop);
                    } else {
                        cancelAnimationFrame(renderAnimationId);
                        if (mediaRecorder.state !== 'inactive') {
                            mediaRecorder.stop();
                        }
                    }
                }

                renderLoop();

            } catch (err) {
                console.error("Studio Error:", err);
                updateStatus(err.message || "Failed to generate short video.", "error");
                liveStatusText.innerText = "Error";
                generateBtn.disabled = false;
                generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Initial Preview Frame
        window.onload = () => {
            drawCanvasFrame(0, {
                words: [
                    { word: "VIRAL", start: 0, end: 1 },
                    { word: "SHORTS", start: 0, end: 1 },
                    { word: "STUDIO", start: 0, end: 1 }
                ]
            });
        };
    </script>
</body>
</html>
